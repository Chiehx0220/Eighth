backend:
  name: github
  repo: Chiehx0220/Eighth
  branch: main
  base_url: https://eighth-cms-oauth.oauth-worker.workers.dev
  auth_endpoint: auth

local_backend: true

media_folder: "src/assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "site"
    label: "網站設定"
    files:
      - name: "site"
        label: "網站設定"
        file: "src/_data/site.yaml"
        fields:
          - { label: "網站名稱", name: "site_title", widget: "string" }
          - { label: "首頁標語", name: "tagline", widget: "string" }
          - { label: "意見信箱連結", name: "suggest_box_url", widget: "string" }
          - { label: "訪客登記表單連結", name: "visitor_registration_url", widget: "string" }
          - label: "員工號(用於登入 /beds/ 床位系統)"
            name: "staff_access_codes"
            widget: "text"
            hint: "多組員工號請用逗號分隔,姓名為選填,格式:員工號:姓名,例如 112120:王小明,118886"
            pattern: ["^[0-9]+(:[^,:]+)?(,\\s*[0-9]+(:[^,:]+)?)*$", "格式錯誤,請用「員工號:姓名」並以逗號分隔,姓名可省略"]

  - name: "dining"
    label: "飲食相關"
    files:
      - name: "dining"
        label: "飲食相關"
        file: "src/_data/dining.yaml"
        fields:
          - label: "院內餐"
            name: "mealService"
            widget: "object"
            fields:
              - { label: "名稱", name: "name", widget: "string" }
              - { label: "說明文字(選填)", name: "note", widget: "text", required: false }
              - label: "分類(可分多個 section,例如普通伙食/治療餐)"
                name: "groups"
                widget: "list"
                allow_add: true
                fields:
                  - { label: "分類名稱(留空則不顯示標題)", name: "name", widget: "string", required: false }
                  - label: "品項"
                    name: "items"
                    widget: "list"
                    allow_add: true
                    fields:
                      - { label: "名稱", name: "name", widget: "string" }
                      - { label: "供餐時間(選填)", name: "time", widget: "string", required: false }
                      - { label: "價格", name: "price", widget: "number" }
                      - { label: "說明", name: "note", widget: "string", required: false }
          - label: "院內其他商店"
            name: "otherShops"
            widget: "object"
            fields:
              - { label: "名稱", name: "name", widget: "string" }
              - label: "商店列表"
                name: "list"
                widget: "list"
                allow_add: true
                fields:
                  - { label: "店名", name: "name", widget: "string" }
                  - { label: "位置", name: "location", widget: "string", required: false }
                  - { label: "這個店在賣什麼", name: "sells", widget: "string" }

  - name: "wards"
    label: "病房單位介紹"
    files:
      - name: "wards"
        label: "病房單位介紹"
        file: "src/_data/wards.yaml"
        fields:
          - label: "單位列表"
            name: "list"
            widget: "list"
            allow_add: true
            collapsed: true
            fields:
              - { label: "單位名稱", name: "name", widget: "string" }
              - { label: "床位數(滿床)", name: "total_beds", widget: "number" }
              - { label: "護理長人數", name: "head_nurse_count", widget: "number" }
              - { label: "副護理長人數", name: "deputy_head_nurse_count", widget: "number" }
              - { label: "護理師人數", name: "staff_nurse_count", widget: "number" }
              - { label: "白班上班人數", name: "shift_day_count", widget: "number" }
              - { label: "小夜上班人數", name: "shift_evening_count", widget: "number" }
              - { label: "大夜上班人數", name: "shift_night_count", widget: "number" }

  - name: "rooms"
    label: "房型"
    files:
      - name: "rooms"
        label: "房型"
        file: "src/_data/rooms.yaml"
        fields:
          - label: "照片與說明"
            name: "photos"
            widget: "list"
            allow_add: true
            collapsed: true
            fields:
              - { label: "房型名稱", name: "type", widget: "string" }
              - { label: "照片", name: "image", widget: "image", required: false }
              - { label: "說明", name: "description", widget: "text" }
          - label: "單人房床位"
            name: "single_room_beds"
            widget: "list"
            allow_add: true
            hint: "這裡只新增/移除床位號碼。目前占用狀態請到 /beds/ 頁面編輯。"
            fields:
              - { label: "床號", name: "label", widget: "string" }
          - label: "雙人房床位"
            name: "double_room_beds"
            widget: "list"
            allow_add: true
            collapsed: true
            summary: "{{fields.room}}"
            hint: "這裡只新增/移除房號。目前占用狀態與性別請到 /beds/ 頁面編輯。"
            fields:
              - { label: "房號", name: "room", widget: "string", hint: "床號會自動用「房號-序號」產生(例如房號 0801 會自動變成床號 0801-1、0801-2),不用另外輸入床號。" }
          - label: "健保四人房床位"
            name: "insured_quad_room_beds"
            widget: "list"
            allow_add: true
            collapsed: true
            summary: "{{fields.room}}"
            hint: "這裡只新增/移除房號。目前占用狀態與性別請到 /beds/ 頁面編輯。"
            fields:
              - { label: "房號", name: "room", widget: "string" }
          - label: "健保雙人房床位"
            name: "insured_double_room_beds"
            widget: "list"
            allow_add: true
            collapsed: true
            summary: "{{fields.room}}"
            hint: "這裡只新增/移除房號。目前占用狀態與性別請到 /beds/ 頁面編輯。"
            fields:
              - { label: "房號", name: "room", widget: "string", hint: "床號會自動用「房號-序號」產生(例如房號 0819 會自動變成床號 0819-1、0819-2),不用另外輸入床號。" }

  - name: "room_fees"
    label: "病房費用"
    files:
      - name: "room_fees"
        label: "病房費用"
        file: "src/_data/room_fees.yaml"
        fields:
          - label: "費用列表"
            name: "list"
            widget: "list"
            allow_add: true
            fields:
              - { label: "病房種類", name: "type", widget: "string" }
              - { label: "自費身分・第一日", name: "self_pay_day1", widget: "number" }
              - { label: "自費身分・第二日以後", name: "self_pay_day2plus", widget: "number" }
              - { label: "健保身分", name: "insured", widget: "number" }

  - name: "selfpay"
    label: "自費項目"
    files:
      - name: "selfpay"
        label: "自費項目"
        file: "src/_data/selfpay.yaml"
        fields:
          - label: "項目列表"
            name: "list"
            widget: "list"
            allow_add: true
            fields:
              - { label: "項目名稱", name: "name", widget: "string" }
              - { label: "價格", name: "price", widget: "string" }
              - { label: "單位", name: "unit", widget: "string", required: false }
              - { label: "說明", name: "note", widget: "text", required: false }

  - name: "visiting"
    label: "探病/會客規定"
    files:
      - name: "visiting"
        label: "探病/會客規定"
        file: "src/_data/visiting.yaml"
        fields:
          - { label: "會客時間", name: "hours", widget: "string" }
          - { label: "規定條列", name: "rules", widget: "list" }
          - { label: "請假規定・前言", name: "leave_intro", widget: "string" }
          - { label: "請假規定條列", name: "leave_rules", widget: "list" }

  - name: "partners"
    label: "合作廠商"
    files:
      - name: "partners"
        label: "合作廠商"
        file: "src/_data/partners.yaml"
        fields:
          - label: "廠商列表"
            name: "list"
            widget: "list"
            allow_add: true
            collapsed: true
            summary: "{{fields.name}}"
            fields:
              - { label: "廠商名稱", name: "name", widget: "string" }
              - { label: "類別(例如:救護車、醫療器材、看護)", name: "category", widget: "string", required: false }
              - { label: "標誌圖片(選填,未上傳則顯示預設圖示)", name: "logo", widget: "image", required: false }
              - { label: "圖示(未上傳標誌時使用,Material Symbols 名稱)", name: "icon", widget: "string", required: false, default: "storefront" }
              - label: "電話(可新增多支,例如平日專線、假日專線)"
                name: "phones"
                widget: "list"
                allow_add: true
                required: false
                fields:
                  - { label: "標籤(選填,例如:假日請撥打)", name: "label", widget: "string", required: false }
                  - { label: "號碼", name: "number", widget: "string" }
              - { label: "Email", name: "email", widget: "string", required: false }
              - { label: "地址", name: "address", widget: "string", required: false }
              - { label: "說明", name: "note", widget: "text", required: false }

  - name: "discharge"
    label: "出院須知"
    files:
      - name: "discharge"
        label: "出院須知"
        file: "src/_data/discharge.yaml"
        fields:
          - { label: "出院流程(依序列出)", name: "discharge_flow", widget: "list" }
          - label: "診斷證明書申請須知"
            name: "certificate_rules"
            widget: "list"
            fields:
              - { label: "圖示(Material Symbols 名稱)", name: "icon", widget: "string" }
              - { label: "標題", name: "title", widget: "string" }
              - { label: "說明", name: "desc", widget: "text" }
