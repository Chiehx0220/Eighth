discharge_flow:
  - 於病床等候護理站通知。
  - 至護理站向書記領取帳單、出院帶藥單及門診回診單
  - 攜健保卡及相關優惠證件至住出院服務中心辦理繳費 取得醫療費用收據。
  - 至病房藥局領取出院帶藥。
certificate_rules:
  - icon: schedule
    title: 一般申請
    desc: 請於前一日告知護理人員,以便安排醫師開立。
  - icon: payments
    title: 費用
    desc: 第一份 100 元,第二份起每份 50 元。
  - icon: content_copy
    title: 需要多份證明
    desc: 請先告知病房書記,辦理完出院手續後即可取得。
  - icon: work
    title: 勞工傷病診斷證明
    desc: 請告知主治醫師或護理師,由醫師開具。
  - icon: emergency
    title: 重大傷病證明
    desc: 醫師開具重大傷病單後,請攜帶身分證及印章至住出院服務中心辦理。
  - icon: public
    title: 外籍人士申請
    desc: 請提前一日告知護理人員,由醫師開具,繳費後即可取得。
  - icon: translate
    title: 英文診斷證明書
    desc: 需提供護照影本,繳費後 3 個工作天可取得。
