intro: 手術恢復、腸胃檢查、牙口調整……醫院飲食常會依身體狀況分階段調整質地。這裡整理四種最常見的「漸進式」飲食,說明每個階段在吃什麼、為什麼這樣安排,以及需要留意的地方。
disclaimer: 實際該從哪個階段開始、何時可以進階,請以主治醫師或營養師的指示為準;本頁僅供衛教參考。
final_note: 這四個階段通常會依身體恢復狀況「漸進式」調整,不一定要從第一階段開始,也不是每個人都會經歷全部四個階段。
stages:
  - id: stage-1
    tag: 01・質地最清澈
    icon: water_drop
    title: 清流質飲食
    subtitle: Clear Liquid Diet
    desc: 只含完全透明、幾乎無渣的液體——倒進杯子裡,光線可以直接穿透。腸胃道幾乎不需要消化就能吸收,吃下去之後也不太會在腸道裡留下殘渣。
    info:
      - title: 什麼時候會吃到
        desc: 腸胃手術剛結束後的第一餐;腸胃鏡、大腸鏡檢查前後。
      - title: 挑選原則
        desc: 拿起來對著光看,看得穿就對了。避免任何果肉、菜渣、油花。
    foods:
      - 米湯
      - 過濾果汁(去果肉)
      - 運動飲料
      - 清高湯
      - 蜂蜜水
      - 無果粒果凍
  - id: stage-2
    tag: 02・質地綿密流動
    icon: blender
    title: 全流質飲食
    subtitle: Full Liquid Diet
    desc: 比清流質濃稠一些,但室溫下仍是液態,用湯匙舀起來會緩緩流下。通常是清流質吃得順利之後的下一步,也適合咀嚼吞嚥比較吃力、但腸胃功能還不錯的人。
    info:
      - title: 什麼時候會吃到
        desc: 清流質階段適應良好之後;咀嚼吞嚥困難但消化功能正常時。
      - title: 進食方式
        desc: 避免顆粒與纖維;可用吸管或湯匙小口慢慢喝。
    foods:
      - 牛奶
      - 豆漿
      - 布丁
      - 冰淇淋
      - 米漿
      - 過篩濃湯
      - 打散蒸蛋
  - id: stage-3
    tag: 03・介於液體與固體之間
    icon: soup_kitchen
    title: 半流質飲食
    subtitle: Soft / Semi-Liquid Diet
    desc: 質地綿密、好咀嚼好吞嚥,介於液體和固體之間,像是煮得綿密的稀飯,或搗成泥狀的食物。這是全流質過渡到一般飲食很重要的中間站。
    info:
      - title: 什麼時候會吃到
        desc: 牙口不好、剛拔牙、輕度吞嚥困難;由全流質往普通飲食過渡時。
      - title: 準備原則
        desc: 食物需切碎或搗成泥狀,避免帶殼帶刺、過硬的顆粒食材。
    foods:
      - 稀飯
      - 蒸蛋
      - 嫩豆腐
      - 絞肉粥
      - 南瓜濃湯
      - 搗泥根莖蔬菜
  - id: stage-4
    tag: 04・已是固體,軟嫩好入口
    icon: restaurant
    title: 軟質飲食
    subtitle: Soft Diet
    desc: 已經是固體食物,但煮得軟爛、切成小塊,讓咀嚼變得輕鬆。適合牙口比較不好、但腸胃消化功能正常的人,也常見於銀髮族的日常飲食安排。
    info:
      - title: 什麼時候會吃到
        desc: 銀髮族日常飲食;牙口不佳但腸胃功能正常者。
      - title: 準備原則
        desc: 避免堅果種子、生菜梗、帶骨帶刺食材,以及過硬過韌的肉類。
    foods:
      - 軟飯
      - 清蒸魚肉
      - 燉煮嫩肉
      - 煮軟葉菜
      - 豆腐
      - 南瓜地瓜
